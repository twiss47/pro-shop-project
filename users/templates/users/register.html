{% extends "app/base/base.html" %}

{% block home_content %}

<!-- Register Page Wrapper -->
<div class="d-flex justify-content-center align-items-center" style="min-height: 90vh;">
    <div class="card shadow-lg p-4" style="width: 400px; border-radius: 15px;">
        
        <!-- Title -->
        <h3 class="text-center mb-4 fw-bold">Create an Account</h3>
        <p class="text-center text-muted mb-4" style="font-size: 14px;">
            Sign up to continue shopping
        </p>

        <!-- Register Form -->
        <form method="POST">
            {% csrf_token %}
            
            <!-- Phone Input -->
            <div class="mb-3">
                <label class="form-label fw-semibold">Phone Number</label>
                <input type="text" name="phone_number" class="form-control form-control-lg"
                       placeholder="+998901234567" required>
            </div>

            <!-- Password Input -->
            <div class="mb-3">
                <label class="form-label fw-semibold">Password</label>
                <input type="password" name="password" class="form-control form-control-lg"
                       placeholder="Create a strong password" required>
            </div>

            <!-- Register Button -->
            <button type="submit" class="btn btn-success w-100 btn-lg mt-2"
                    style="border-radius: 10px;">
                Register
            </button>
        </form>

        <!-- Login Link -->
        <p class="text-center mt-3" style="font-size: 14px;">
            Already have an account?
            <a href="{% url 'users:login' %}" class="fw-semibold">Login</a>
        </p>

    </div>
</div>

{% endblock %}
