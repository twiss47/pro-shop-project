{% extends "app/base/base.html" %}

{% block home_content %}

<!-- Login Page Wrapper -->
<div class="d-flex justify-content-center align-items-center" style="min-height: 90vh;">
    <div class="card shadow-lg p-4" style="width: 400px; border-radius: 15px;">
        
        <!-- Title -->
        <h3 class="text-center mb-4 fw-bold">Welcome Back</h3>
        <p class="text-center text-muted mb-4" style="font-size: 14px;">
            Please enter your phone and password
        </p>

        <!-- Error Message -->
        {% if error %}
            <div class="alert alert-danger text-center">{{ error }}</div>
        {% endif %}

        <!-- Login Form -->
        <form method="POST">
            {% csrf_token %}
            
            <!-- Phone Input -->
            <div class="mb-3">
                <label class="form-label fw-semibold">Phone Number</label>
                <input type="text" name="phone_number" class="form-control form-control-lg"
                       placeholder="+998901234567" required>
            </div>

            <!-- Password Input -->
            <div class="mb-3">
                <label class="form-label fw-semibold">Password</label>
                <input type="password" name="password" class="form-control form-control-lg"
                       placeholder="Enter your password" required>
            </div>

            <!-- Login Button -->
            <button type="submit" class="btn btn-primary w-100 btn-lg mt-2"
                    style="border-radius: 10px;">
                Login
            </button>
        </form>

        <!-- Register Link -->
        <p class="text-center mt-3" style="font-size: 14px;">
            Don’t have an account?
            <a href="{% url 'users:register' %}" class="fw-semibold">Create one</a>
        </p>

    </div>
</div>

{% endblock %}
